<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collection — Ethereal Perfumes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="shop">
  <div id="site-header"></div>

  <main>
    <div class="container">
      <div class="page-title">
        <p class="eyebrow">Ethereal Perfumes</p>
        <h1>Our Collection</h1>
        <p>Browse every fragrance, filter by category or brand, and check availability.</p>
      </div>

      <div class="toolbar">
        <div class="toolbar-row">
          <input class="grow" type="search" id="shop-search" placeholder="Search by perfume name or brand…" autocomplete="off" aria-label="Search perfumes">
          <select id="sort-select" aria-label="Sort by">
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
          </select>
        </div>
        <div class="toolbar-row">
          <div class="pills" id="cat-pills" role="group" aria-label="Category"></div>
          <select id="brand-filter" aria-label="Brand"></select>
          <select id="price-filter" aria-label="Price range">
            <option value="all">Any price</option>
            <option value="u4">Under ₱4,000</option>
            <option value="4-6">₱4,000 – ₱5,999</option>
            <option value="6-8">₱6,000 – ₱7,999</option>
            <option value="8up">₱8,000 &amp; up</option>
          </select>
          <label class="check" style="margin:0;text-transform:none;letter-spacing:0"><input type="checkbox" id="instock-only"> Available only</label>
          <button class="btn btn-ghost btn-sm" id="reset-filters" type="button">Clear filters</button>
        </div>
      </div>

      <div class="shop-body">
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div class="grid" id="shop-grid"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
